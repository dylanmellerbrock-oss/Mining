[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quarry-screen"
version = "0.1.0"
description = "First-pass screening tool for small sand/gravel quarry sites near Westerville, OH."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "click>=8.1",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pandas>=2.1",
    "geopandas>=0.14",
    "shapely>=2.0",
    "pyproj>=3.6",
    "folium>=0.15",
    "tenacity>=8.2",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
quarry-screen = "quarry_screen.cli:cli"

[tool.setuptools.packages.find]
include = ["quarry_screen*"]
